<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대치동 빅3 레벨테스트 대비 · 저학년</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#16305B; --navy:#2B5BC4; --navy-deep:#1E3F86; --navy-ink:#0F2547;
  --sky:#DCE9FF; --sky-2:#EDF3FF; --paper:#EEF4FF; --card:#FFFFFF;
  --amber:#FFB323; --amber-deep:#E8961A; --green:#1FA971; --green-2:#E4F7EE;
  --coral:#F2615B; --coral-2:#FDEBEA; --line:#CBD9F2; --line-soft:#E2EBFB; --muted:#5E709A;
  --shadow:0 22px 48px -26px rgba(22,48,91,.5);
  --shadow-sm:0 10px 22px -14px rgba(22,48,91,.45);
  --r-xl:30px; --r-lg:24px; --r-md:16px; --r-sm:11px;
  --disp:"Jua",system-ui,sans-serif;
  --num:"Fredoka",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink);
  background:
    radial-gradient(1100px 560px at 112% -10%, #E2EDFF 0%, rgba(226,237,255,0) 58%),
    radial-gradient(820px 460px at -12% 6%, #E7F0FF 0%, rgba(231,240,255,0) 55%),
    var(--paper);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 96px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(238,244,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-in{max-width:920px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:38px;height:38px;flex:none}
.brand .bt{font-family:var(--disp);font-size:18px;color:var(--ink);line-height:1.05}
.brand .bs{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.stars{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#FFF4DC,#FFE9BC);
  border:1.5px solid #FFD982;border-radius:999px;padding:6px 14px 6px 10px;
  box-shadow:var(--shadow-sm)
}
.stars svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 2px 0 rgba(232,150,26,.35))}
.stars b{font-family:var(--num);font-size:18px;color:var(--amber-deep);line-height:1;min-width:14px;text-align:right}
.stars span{font-size:11px;color:#A9781F;font-weight:700}

/* ---------- nav chips ---------- */
.nav{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-family:var(--disp);font-size:15px;color:var(--navy-deep);
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:9px 17px;transition:transform .12s,box-shadow .15s,background .15s,color .15s;
  box-shadow:0 2px 0 var(--line-soft)
}
.chip:hover{transform:translateY(-1px)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy-deep);box-shadow:0 8px 16px -8px rgba(43,91,196,.7)}

/* ---------- hero ---------- */
.hero{
  position:relative;margin-top:14px;border-radius:var(--r-xl);overflow:hidden;
  background:linear-gradient(135deg,#2B5BC4 0%,#1E3F86 64%,#16305B 100%);
  color:#fff;padding:30px 28px 28px;box-shadow:var(--shadow)
}
.hero .eyebrow{font-family:var(--num);font-weight:600;letter-spacing:.16em;font-size:12px;color:#BCD2FF;text-transform:uppercase}
.hero h1{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.22;margin:8px 0 8px}
.hero p{margin:0;color:#D8E5FF;font-size:14px;font-weight:500;max-width:46ch}
.hero .pills{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero .pill{font-family:var(--num);font-weight:600;font-size:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:6px 13px}
.hero .blob{position:absolute;right:-30px;top:-30px;width:200px;height:200px;opacity:.9;pointer-events:none}
.hero .blob2{position:absolute;right:64px;bottom:-46px;width:120px;height:120px;opacity:.5;pointer-events:none}

/* ---------- quest cards ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.qcard{
  position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow-sm);
  transition:transform .14s,box-shadow .18s,border-color .18s;overflow:hidden
}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--navy)}
.qcard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px}
.qcard h3{font-family:var(--disp);font-weight:400;font-size:19px;margin:0 0 4px}
.qcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.qcard .go{margin-top:13px;display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:14px;color:var(--navy-deep)}
.qcard .tag{position:absolute;top:14px;right:14px;font-family:var(--num);font-weight:600;font-size:11px;color:var(--muted);background:var(--sky-2);border-radius:999px;padding:4px 9px}
.qcard .go svg{width:16px;height:16px;transition:transform .15s}
.qcard:hover .go svg{transform:translateX(3px)}

/* ---------- section frame ---------- */
.sec-head{display:flex;align-items:center;gap:13px;margin:18px 2px 4px}
.sec-head .badge{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none}
.sec-head h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.sec-head .kr{font-size:13px;color:var(--muted);font-weight:500}
.note{
  background:var(--sky-2);border-left:5px solid var(--navy);border-radius:0 14px 14px 0;
  padding:12px 16px;font-size:13.5px;color:var(--navy-deep);font-weight:500;line-height:1.55;margin:14px 0
}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}
.tab{font-family:var(--disp);font-size:14px;color:var(--navy-deep);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 15px;transition:.14s}
.tab.on{background:var(--navy-deep);color:#fff;border-color:var(--navy-ink)}
.subtitle{font-family:var(--disp);font-size:17px;color:var(--ink);margin:20px 2px 2px}

/* ---------- mcq ---------- */
.q{background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--r-md);padding:16px 17px;margin:13px 0;box-shadow:var(--shadow-sm)}
.q .qhead{display:flex;gap:11px;align-items:flex-start}
.q .qn{font-family:var(--num);font-weight:700;font-size:15px;color:#fff;background:var(--navy);min-width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none;margin-top:1px}
.q .qt{font-size:15.5px;font-weight:500;line-height:1.5;color:var(--ink);padding-top:2px}
.q .qt .blank{color:var(--navy);font-weight:700;letter-spacing:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{
  display:flex;align-items:center;gap:10px;text-align:left;background:var(--sky-2);
  border:1.5px solid var(--line-soft);border-radius:13px;padding:11px 13px;font-size:14.5px;
  font-weight:500;color:var(--ink);transition:transform .1s,background .15s,border-color .15s
}
.opt:hover:not(.locked){background:#fff;border-color:var(--navy);transform:translateY(-1px)}
.opt .mk{font-family:var(--num);font-weight:700;font-size:13px;color:var(--navy);background:#fff;border:1.5px solid var(--line);width:25px;height:25px;border-radius:8px;display:grid;place-items:center;flex:none}
.opt.correct{background:var(--green-2);border-color:var(--green);color:#0f7a4f}
.opt.correct .mk{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:var(--coral-2);border-color:var(--coral);color:#c0392b}
.opt.wrong .mk{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.explain{margin-top:12px;font-size:13px;color:var(--navy-deep);background:#fff;border:1px dashed var(--line);border-radius:11px;padding:10px 12px;line-height:1.55;display:none}
.explain.show{display:block;animation:fade .25s ease}
.explain b{color:var(--green)}

/* score bar */
.scorebar{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin:14px 0;box-shadow:var(--shadow-sm)}
.scorebar .lab{font-family:var(--disp);font-size:15px;color:var(--ink)}
.scorebar .track{flex:1;height:11px;background:var(--sky);border-radius:999px;overflow:hidden}
.scorebar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--amber));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.scorebar .frac{font-family:var(--num);font-weight:700;font-size:15px;color:var(--navy-deep)}

/* ---------- flashcards ---------- */
.fc-top{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.fc-top .count{font-family:var(--num);font-weight:600;color:var(--muted);font-size:14px}
.flash{perspective:1400px;margin:8px 0}
.flash-inner{position:relative;width:100%;min-height:280px;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.flash.flip .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.face.front{background:linear-gradient(140deg,#fff,#F1F6FF);border:1.5px solid var(--line);align-items:center;justify-content:center;text-align:center}
.face.front .pos{font-family:var(--num);font-weight:600;font-size:13px;color:var(--navy);background:var(--sky-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.face.front .word{font-family:var(--num);font-weight:700;font-size:46px;color:var(--ink);margin:14px 0 6px;letter-spacing:.5px}
.face.front .hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.face.back{background:linear-gradient(140deg,#1E3F86,#16305B);color:#fff;transform:rotateY(180deg);justify-content:center}
.face.back .kr{font-family:var(--disp);font-size:30px;margin-bottom:14px}
.face.back .row{font-size:14px;color:#CFE0FF;margin:4px 0;line-height:1.5}
.face.back .row b{color:#FFD982;font-family:var(--num);font-weight:600}
.face.back .ex{margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:11px 13px;font-size:14px;font-style:italic;color:#EAF1FF;line-height:1.5}
.spk{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:12px;background:var(--amber);display:grid;place-items:center;box-shadow:0 6px 0 var(--amber-deep);transition:transform .1s;z-index:3}
.spk:active{transform:translateY(3px);box-shadow:0 3px 0 var(--amber-deep)}
.spk svg{width:21px;height:21px}
.fc-nav{display:flex;gap:10px;margin-top:14px}
.btn{font-family:var(--disp);font-size:15px;border-radius:14px;padding:12px 18px;transition:transform .1s,box-shadow .15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn svg{width:17px;height:17px}
.btn-nav{flex:1;background:var(--card);border:1.5px solid var(--line);color:var(--navy-deep);box-shadow:0 3px 0 var(--line-soft)}
.btn-nav:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-soft)}
.btn-nav:disabled{opacity:.4;cursor:default}
.btn-pri{background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--navy-deep)}
.btn-pri:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy-deep)}
.unit-pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.upill{font-family:var(--disp);font-size:13.5px;color:var(--navy-deep);background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:8px 13px;transition:.14s}
.upill .n{font-family:var(--num);font-weight:700;color:var(--amber-deep);margin-right:6px}
.upill.on{background:var(--navy);color:#fff;border-color:var(--navy-deep)}
.upill.on .n{color:#FFD982}

/* ---------- listening ---------- */
.play-row{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,#fff,#F1F6FF);border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.play-btn{width:50px;height:50px;border-radius:14px;background:var(--navy);display:grid;place-items:center;flex:none;box-shadow:0 5px 0 var(--navy-deep);transition:transform .1s}
.play-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy-deep)}
.play-btn svg{width:22px;height:22px}
.play-row .pl-lab{font-family:var(--disp);font-size:15px;color:var(--ink)}
.play-row .pl-sub{font-size:12px;color:var(--muted)}

/* ---------- reading ---------- */
.passage{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow-sm);margin:12px 0}
.passage h4{font-family:var(--num);font-weight:700;font-size:18px;color:var(--navy-deep);margin:0 0 10px}
.passage p{font-size:15px;line-height:1.75;margin:0 0 9px;color:#22335a}

/* ---------- writing ---------- */
.write{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm);margin:13px 0}
.write .pen{font-size:13px;color:var(--muted);margin:0 0 2px;font-weight:500}
.write .pkr{font-family:var(--disp);font-size:17px;color:var(--ink);margin:0 0 12px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 14px}
.bank .bw{font-family:var(--num);font-weight:600;font-size:13px;color:var(--navy-deep);background:var(--sky-2);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.12s}
.bank .bw:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.scaff{display:flex;flex-direction:column;gap:9px}
.scaff .sl{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.scaff .pre{font-size:14.5px;color:#36476e;font-weight:500;flex:none}
.scaff input{flex:1;min-width:90px;font-family:inherit;font-size:14.5px;color:var(--ink);border:none;border-bottom:2px solid var(--line);background:transparent;padding:5px 4px;outline:none}
.scaff input:focus{border-color:var(--navy)}
.write textarea{width:100%;margin-top:12px;min-height:84px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14.5px;color:var(--ink);resize:vertical;outline:none;background:#FBFDFF}
.write textarea:focus{border-color:var(--navy)}

/* ---------- interview ---------- */
.iv{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:17px;box-shadow:var(--shadow-sm);margin:13px 0}
.iv .qrow{display:flex;align-items:flex-start;gap:11px}
.iv .qen{font-family:var(--num);font-weight:600;font-size:16px;color:var(--ink);line-height:1.4}
.iv .qkr{font-size:13.5px;color:var(--muted);margin-top:3px}
.iv .mini-spk{width:38px;height:38px;border-radius:11px;background:var(--amber);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--amber-deep);transition:transform .1s}
.iv .mini-spk:active{transform:translateY(2px);box-shadow:0 2px 0 var(--amber-deep)}
.iv .mini-spk svg{width:18px;height:18px}
.iv .tip{margin-top:11px;font-size:13px;color:var(--navy-deep);background:var(--sky-2);border-radius:11px;padding:9px 12px;line-height:1.5}
.iv .tip b{color:var(--amber-deep)}
.iv .reveal{margin-top:9px}
.iv .sample{display:none;margin-top:9px;font-size:14px;color:#0f7a4f;background:var(--green-2);border:1px solid #bfe9d4;border-radius:11px;padding:10px 12px;font-style:italic}
.iv .sample.show{display:block;animation:fade .25s}
.ghost{font-family:var(--disp);font-size:13px;color:var(--navy);background:var(--sky-2);border:1.5px solid var(--line);border-radius:10px;padding:7px 13px}

/* ---------- toast / star burst ---------- */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--navy-ink);color:#fff;font-family:var(--disp);font-size:15px;padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:80;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:20px;height:20px}
.burst{position:fixed;pointer-events:none;z-index:90;width:14px;height:14px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rise{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.pop{animation:pop .3s ease}
.enter{animation:fade .35s ease both}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;font-family:var(--num);font-weight:500}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand" data-action="home">
      <svg class="logo" viewBox="0 0 44 44" fill="none"><rect x="2" y="2" width="40" height="40" rx="12" fill="#2B5BC4"/><path d="M22 9l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6L22 26.8l-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1L22 9z" fill="#FFB323"/></svg>
      <div><div class="bt">빅3 레벨테스트</div><div class="bs">ILE · 피아이 · 렉스김 · 저학년</div></div>
    </div>
    <div class="stars" title="모은 별">
      <svg viewBox="0 0 24 24" fill="#FFB323"><path d="M12 2l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.4l1.1-6.5L2.6 8.8l6.5-.9L12 2z"/></svg>
      <b id="starN">0</b><span>별</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="nav" id="nav"></div>
  <div id="app"></div>
  <div class="foot">대치동 빅3 레벨테스트 대비 · 저학년 · 듣기는 소리 버튼을 눌러 연습하세요</div>

x it: 'we went to the zoo'","options":["we went to the zoo.","We went to the zoo.","We Went To The Zoo","we Went to the zoo"],"answer":1,"explainKr":"첫 글자만 대문자, 마침표로 끝."}],"reading":[{"title":"The Wind and the Sun","passage":["The wind and the sun argued about who was stronger.","They saw a man wearing a warm coat.","The wind blew hard, but the man held his coat tighter.","Then the sun shone gently, and the man took off his coat."],"questions":[{"q":"What did the wind and sun argue about?","options":["Who was kinder","Who was stronger","Who was older","Who was faster"],"answer":1},{"q":"What did the man do when the wind blew?","options":["Took off his coat","Held it tighter","Ran away","Slept"],"answer":1},{"q":"Who won in the end?","options":["The wind","The sun","The man","No one"],"answer":1}]}],"writing":[{"promptEn":"Write three sentences about a rule at your school. Use capital letters and periods.","promptKr":"우리 학교의 규칙 하나를 세 문장으로 쓰세요. 대문자와 마침표를 지키세요.","scaffold":["At my school, we must ___.","This rule helps us ___.","I think the rule is ___."],"wordBank":["polite","quiet","share","honest","follow"]}]}}};</script>
<script>
(function(){
"use strict";
var D = window.PREP_DATA;
var app = document.getElementById('app');
var nav = document.getElementById('nav');
var toastEl = document.getElementById('toast');
var state = { stars:0 };

var I = {
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.4l1.1-6.5L2.6 8.8l6.5-.9L12 2z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="#1E3F86"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 1.2v2.1a7 7 0 010 17.4v2.1a9 9 0 000-21.6z"/></svg>',
  arrowR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  arrowL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  flip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0115-6.7L21 8M21 3v5h-5M21 12a9 9 0 01-15 6.7L3 16M3 21v-5h5"/></svg>'
};
function badge(bg,inner){return '<span class="badge" style="background:'+bg+'">'+inner+'</span>';}
function bigIcon(c){return '<svg viewBox="0 0 24 24" width="24" height="24" fill="#fff">'+c+'</svg>';}

function speak(text, lang){
  if(!('speechSynthesis' in window)){ toast('이 기기는 소리 재생을 지원하지 않아요'); return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US'; u.rate = 0.86; u.pitch = 1.04;
    speechSynthesis.speak(u);
  }catch(e){}
}

function toast(msg, withStar){
  toastEl.innerHTML = (withStar?I.star:'') + '<span>'+msg+'</span>';
  toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){toastEl.classList.remove('show');},1500);
}
function addStar(originEl){
  state.stars++;
  var n = document.getElementById('starN');
  n.textContent = state.stars; n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
  if(originEl) burst(originEl);
}
function burst(el){
  var r = el.getBoundingClientRect();
  for(var i=0;i<6;i++){
    var s = document.createElement('div'); s.className='burst';
    s.innerHTML = '<svg viewBox="0 0 24 24" fill="#FFB323"><path d="M12 2l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.4l1.1-6.5L2.6 8.8l6.5-.9L12 2z"/></svg>';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top=(r.top+r.height/2)+'px';
    var ang = Math.random()*6.28, dist=30+Math.random()*40;
    s.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist - 10)+'px');
    s.style.animation='rise .6s ease forwards';
    document.body.appendChild(s);
    (function(node){setTimeout(function(){node.remove();},620);})(s);
  }
}

var SECTIONS = [
  {id:'home', label:'홈'},
  {id:'vocab', label:'어휘집'},
  {id:'ile', label:'ILE'},
  {id:'peai', label:'피아이'},
  {id:'lex', label:'렉스김'},
  {id:'mock', label:'모의고사'}
];
function renderNav(active){
  nav.innerHTML = SECTIONS.map(function(s){
    return '<button class="chip'+(s.id===active?' on':'')+'" data-go="'+s.id+'">'+s.label+'</button>';
  }).join('');
}

var LET = ['A','B','C','D','E'];

function mcqBlock(items, keyPrefix, opts){
  opts = opts || {};
  var html = '';
  if(opts.score!==false){
    html += '<div class="scorebar" data-score="'+keyPrefix+'"><span class="lab">점수</span>'
         + '<div class="track"><div class="fill"></div></div>'
         + '<span class="frac">0 / '+items.length+'</span></div>';
  }
  items.forEach(function(it,qi){
    var key = keyPrefix+'_'+qi;
    var qtext = String(it.q).replace(/___/g,'<span class="blank">_____</span>');
    html += '<div class="q enter" data-q="'+key+'">'
      + '<div class="qhead"><div class="qn">'+(qi+1)+'</div><div class="qt">'+qtext+'</div></div>'
      + '<div class="opts">'
      + it.options.map(function(o,oi){
          return '<button class="opt" data-pick="'+key+'" data-qi="'+qi+'" data-oi="'+oi+'" data-prefix="'+keyPrefix+'">'
               + '<span class="mk">'+LET[oi]+'</span><span>'+o+'</span></button>';
        }).join('')
      + '</div>'
      + (it.explainKr ? '<div class="explain"><b>정답 '+LET[it.answer]+'.</b> '+it.explainKr+'</div>' : '')
      + '</div>';
  });
  return html;
}
var quizMeta = {};
function registerQuiz(prefix, items){ quizMeta[prefix] = {total:items.length, items:items, correct:0, done:{}}; }

function handlePick(btn){
  var key = btn.getAttribute('data-pick');
  var prefix = btn.getAttribute('data-prefix');
  var qi = +btn.getAttribute('data-qi');
  var oi = +btn.getAttribute('data-oi');
  var meta = quizMeta[prefix];
  if(!meta || meta.done[qi]) return;
  meta.done[qi] = true;
  var ans = meta.items[qi].answer;
  var qEl = document.querySelector('.q[data-q="'+key+'"]');
  var optBtns = qEl.querySelectorAll('.opt');
  optBtns.forEach(function(b){ b.classList.add('locked'); });
  if(oi===ans){
    btn.classList.add('correct','pop'); meta.correct++; addStar(btn);
  } else {
    btn.classList.add('wrong');
    optBtns[ans].classList.add('correct');
    optBtns.forEach(function(b,bi){ if(bi!==oi && bi!==ans) b.classList.add('dim'); });
  }
  var ex = qEl.querySelector('.explain'); if(ex) ex.classList.add('show');
  var sb = document.querySelector('[data-score="'+prefix+'"]');
  if(sb){
    sb.querySelector('.frac').textContent = meta.correct+' / '+meta.total;
    sb.querySelector('.fill').style.width = (meta.correct/meta.total*100)+'%';
  }
  var answeredCount = Object.keys(meta.done).length;
  if(answeredCount===meta.total){
    var pct = Math.round(meta.correct/meta.total*100);
    setTimeout(function(){ toast('완료! '+meta.correct+'/'+meta.total+' 맞았어요 ('+pct+'점)', true); },320);
  }
}

function viewHome(){

    {go:'peai', bg:'#E4F7EE', ic:'#1FA971', t:'피아이 (PEAI)', d:'독해·글쓰기·1:1 인터뷰. 말하기와 토론을 중요하게 봐요.', tag:'3개 영역', icon:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/>'},
    {go:'lex', bg:'#FBE3E2', ic:'#F2615B', t:'렉스김 (LexKim)', d:'문법·글쓰기·독해·인터뷰. 셋 중 가장 엄격해요.', tag:'4개 영역', icon:'<path d="M12 2l3 6 6 .9-4.5 4.4 1 6.3L12 17l-5.5 2.6 1-6.3L3 8.9 9 8l3-6z"/>'},
    {go:'mock', bg:'#E7E0FF', ic:'#6A4DD0', t:'실전 모의고사', d:'학원별 형식 그대로 한 번에 풀어 보는 모의 레벨테스트.', tag:'A · B · C', icon:'<path d="M9 11l3 3 8-8" fill="none" stroke="#6A4DD0" stroke-width="2.4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" fill="none" stroke="#6A4DD0" stroke-width="2.4"/>'}
  ];
  var grid = cards.map(function(c){
    return '<button class="qcard enter" data-go="'+c.go+'">'

      + '<h3>'+c.t+'</h3><p>'+c.d+'</p>'
      + '<span class="go">시작하기 '+I.arrowR+'</span></button>';
  }).join('');
  app.innerHTML =
    '<div class="hero enter">'
    + '<svg class="blob" viewBox="0 0 200 200"><path fill="rgba(255,255,255,.10)" d="M44,-58C57,-49,67,-35,71,-19C75,-3,73,16,64,30C55,44,40,53,23,60C6,67,-13,71,-30,65C-47,59,-62,43,-67,25C-72,7,-67,-13,-57,-29C-47,-45,-32,-57,-15,-63C2,-69,21,-67,44,-58Z" transform="translate(100 100)"/></svg>'
    + '<svg class="blob2" viewBox="0 0 200 200"><path fill="rgba(255,179,35,.5)" d="M48,-62C61,-52,68,-35,70,-18C72,-1,68,16,59,30C50,44,35,55,18,62C1,69,-18,72,-34,65C-50,58,-63,41,-67,23C-71,5,-66,-14,-56,-29C-46,-44,-31,-55,-14,-62C3,-69,21,-72,48,-62Z" transform="translate(100 100)"/></svg>'
    + '<div class="eyebrow">Daechi Big 3 · Level Test Prep</div>'
    + '<h1>대치동 빅3 레벨테스트<br>한 권으로 준비해요</h1>'
    + '<p>ILE · 피아이 · 렉스김. 단어부터 듣기·독해·글쓰기·인터뷰까지, 카드와 퀴즈로 재미있게 연습해요.</p>'
    + '<div class="pills"><span class="pill">단어 80개</span><span class="pill">소리로 듣기</span><span class="pill">정답 즉시 확인</span><span class="pill">별 모으기</span></div>'
    + '</div>'
    + '<div class="grid">'+grid+'</div>';
}

function secHead(badgeBg, badgeIc, title, kr){
  return '<div class="sec-head enter">'+badge(badgeBg, bigIcon(badgeIc))
    + '<div><h2>'+title+'</h2><div class="kr">'+kr+'</div></div></div>';

var vState = {unit:0, idx:0, flip:false};
function genUnitQuiz(unit){
  var words = unit.words, all = words.map(function(w){return w.syn;});
  return words.map(function(w){
    var distract = all.filter(function(s){return s!==w.syn;});
    shuffle(distract); var opts=[w.syn,distract[0],distract[1],distract[2]];
    shuffle(opts);
    return {q:'"'+w.w+'" 와 비슷한 말은?', options:opts, answer:opts.indexOf(w.syn)};
  });
}
function viewVocab(){
  renderNav('vocab');
  var pills = D.vocabUnits.map(function(u,i){
    return '<button class="upill'+(i===vState.unit?' on':'')+'" data-unit="'+i+'"><span class="n">'+(i+1)+'</span>'+u.titleKr+'</button>';
  }).join('');
  app.innerHTML =
    secHead('#FFF0CF','<path d="M4 5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" stroke="#fff" stroke-width="1.6" fill="none"/>', '필수 어휘집', 'Essential Vocabulary · 주제별 80단어')
    + '<div class="note enter">카드를 눌러 뜻을 확인하고, 소리 버튼으로 발음을 들어 보세요. 아래 퀴즈에서 동의어를 맞히면 별을 얻어요.</div>'
    + '<div class="unit-pills">'+pills+'</div>'
    + '<div id="vocabBody"></div>';
  renderVocabBody();
}
function renderVocabBody(){
  var unit = D.vocabUnits[vState.unit];
  var w = unit.words[vState.idx];
  var body = document.getElementById('vocabBody');
  var quiz = genUnitQuiz(unit);
  var qprefix = 'vq_'+unit.id;
  registerQuiz(qprefix, quiz);
  body.innerHTML =
    '<div class="subtitle">단어 카드</div>'
    + '<div class="fc-top"><span class="count">'+unit.titleEn+'</span><span class="count">'+(vState.idx+1)+' / '+unit.words.length+'</span></div>'
    + '<div class="flash'+(vState.flip?' flip':'')+'" id="flash" data-action="flip">'
    +   '<div class="flash-inner">'
    +     '<div class="face front">'
    +       '<button class="spk" data-say="'+w.w+'" data-action="say">'+I.sound+'</button>'
    +       '<span class="pos">'+w.pos+'</span><div class="word">'+w.w+'</div>'
    +       '<div class="hint">카드를 눌러 뜻 보기</div>'
    +     '</div>'
    +     '<div class="face back">'
    +       '<button class="spk" data-say="'+w.w+'" data-action="say">'+I.sound+'</button>'
    +       '<div class="kr">'+w.kr+'</div>'
    +       '<div class="row">동의어 <b>'+w.syn+'</b></div>'
    +       '<div class="ex">"'+w.ex+'"</div>'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="fc-nav">'
    +   '<button class="btn btn-nav" data-action="prev" '+(vState.idx===0?'disabled':'')+'>'+I.arrowL+' 이전</button>'
    +   '<button class="btn btn-nav" data-action="flipbtn">'+I.flip+' 뒤집기</button>'
    +   '<button class="btn btn-nav" data-action="next" '+(vState.idx===unit.words.length-1?'disabled':'')+'>다음 '+I.arrowR+'</button>'
    + '</div>'
    + '<div class="subtitle">동의어 퀴즈</div>'
    + '<div class="note enter">단어와 가장 비슷한 뜻의 단어를 골라요.</div>'
    + mcqBlock(quiz, qprefix);
}

var tabState = {};
function passageHtml(rd, prefix){
  var h = '<div class="passage enter"><h4>'+rd.title+'</h4>'
    + rd.passage.map(function(p){return '<p>'+p+'</p>';}).join('') + '</div>';
  registerQuiz(prefix, rd.questions);
  h += mcqBlock(rd.questions, prefix);
  return h;
}
function listeningHtml(items, prefix){
  registerQuiz(prefix, items);
  var html = '<div class="scorebar" data-score="'+prefix+'"><span class="lab">점수</span><div class="track"><div class="fill"></div></div><span class="frac">0 / '+items.length+'</span></div>';
  items.forEach(function(it,qi){
    var key=prefix+'_'+qi;
    html += '<div class="q enter" data-q="'+key+'">'
      + '<div class="play-row"><button class="play-btn" data-say="'+it.say.replace(/"/g,'&quot;')+'" data-action="say">'+I.play+'</button>'
      + '<div><div class="pl-lab">소리 듣기</div><div class="pl-sub">버튼을 눌러 잘 들어 보세요'+(it.type==='sentence'?' (문장)':' (단어)')+'</div></div></div>'
      + '<div class="qhead"><div class="qn">'+(qi+1)+'</div><div class="qt">'+it.q+'</div></div>'
      + '<div class="opts">'
      + it.options.map(function(o,oi){return '<button class="opt" data-pick="'+key+'" data-qi="'+qi+'" data-oi="'+oi+'" data-prefix="'+prefix+'"><span class="mk">'+LET[oi]+'</span><span>'+o+'</span></button>';}).join('')
      + '</div></div>';
  });
  return html;
}
function writingHtml(items){
  return items.map(function(wb){
    var bank = wb.wordBank ? '<div class="bank">'+wb.wordBank.map(function(b){return '<button class="bw" data-action="say" data-say="'+b+'">'+b+'</button>';}).join('')+'</div>' : '';
    var scaff = wb.scaffold.map(function(s){
      var parts = String(s).split('___');
      return '<div class="sl"><span class="pre">'+parts[0]+'</span><input type="text" placeholder="..." />'+(parts[1]!==undefined&&parts[1]!==''?'<span class="pre">'+parts[1]+'</span>':'')+'</div>';
    }).join('');
    return '<div class="write enter"><p class="pen">'+wb.promptEn+'</p><p class="pkr">'+wb.promptKr+'</p>'
      + (bank?'<div class="pen">단어 도움말 (눌러서 발음 듣기)</div>'+bank:'')
      + '<div class="scaff">'+scaff+'</div>'
      + '<textarea placeholder="위 문장들을 모아 내 글을 완성해 보세요."></textarea></div>';
  }).join('');
}
function interviewHtml(items){
  return items.map(function(iv,i){
    return '<div class="iv enter"><div class="qrow">'
      + '<button class="mini-spk" data-action="say" data-say="'+iv.qEn.replace(/"/g,'&quot;')+'">'+I.sound+'</button>'
      + '<div><div class="qen">'+iv.qEn+'</div><div class="qkr">'+iv.qKr+'</div></div></div>'
      + (iv.tipKr?'<div class="tip"><b>도움말</b> · '+iv.tipKr+'</div>':'')
      + (iv.sample?'<div class="reveal"><button class="ghost" data-action="sample" data-i="'+i+'">예시 답변 보기</button><div class="sample" id="sample_'+i+'">'+iv.sample+'</div></div>':'')
      + '</div>';
  }).join('');
}

function academyView(cfg){
  renderNav(cfg.id);
  var tabs = cfg.tabs;
  if(tabState[cfg.id]===undefined) tabState[cfg.id]=0;
  var ti = tabState[cfg.id];
  app.innerHTML =
    secHead(cfg.bg, cfg.icon, cfg.title, cfg.kr)
    + '<div class="note enter">'+cfg.intro+'</div>'
    + '<div class="tabs">'+tabs.map(function(t,i){return '<button class="tab'+(i===ti?' on':'')+'" data-tab="'+cfg.id+'" data-ti="'+i+'">'+t.label+'</button>';}).join('')+'</div>'
    + '<div id="tabBody"></div>';
  document.getElementById('tabBody').innerHTML = tabs[ti].render();
}

  academyView({
    id:'ile', bg:'#DCE9FF',
    icon:'<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/>',
    title:'ILE 대비', kr:'Listening · Reading · Grammar · Vocabulary · Interview',
    intro:'ILE는 빅3 중 가장 종합적입니다. 듣기·독해·문법·어휘를 모두 보고, 인터뷰로 마무리해요.',
    tabs:[
      {label:'듣기', render:function(){return '<div class="note">소리 버튼을 누르면 영어 발음이 나와요. 듣고 알맞은 답을 고르세요.</div>'+listeningHtml(D.ile.listening,'ile_listen');}},
      {label:'독해', render:function(){return passageHtml(D.ile.reading[0],'ile_read0')+(D.ile.reading[1]?passageHtml(D.ile.reading[1],'ile_read1'):'');}},

      {label:'어휘', render:function(){registerQuiz('ile_vocab',D.ile.vocabulary);return '<div class="note">문장 속에서 밑줄 친 단어와 비슷한 말을 고르는 유형이에요.</div>'+mcqBlock(D.ile.vocabulary,'ile_vocab');}},
      {label:'인터뷰', render:function(){return '<div class="note">소리 버튼으로 질문을 듣고, 큰 소리로 답해 보세요.</div>'+interviewHtml(D.ile.interview);}}
    ]
  });
}
function viewPEAI(){
  academyView({
    id:'peai', bg:'#E4F7EE',
    icon:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/>',
    title:'피아이 (PEAI) 대비', kr:'Reading · Writing · 1:1 Interview',
    intro:'피아이는 독해와 글쓰기, 그리고 1:1 인터뷰로 말하기를 중요하게 봅니다.',
    tabs:[
      {label:'독해', render:function(){return passageHtml(D.peai.reading[0],'peai_read0')+(D.peai.reading[1]?passageHtml(D.peai.reading[1],'peai_read1'):'');}},
      {label:'글쓰기', render:function(){return '<div class="note">시작 문장을 따라 빈칸을 채우고, 아래에 내 글을 완성해요.</div>'+writingHtml(D.peai.writing);}},
      {label:'인터뷰', render:function(){return '<div class="note">예시 답변도 참고할 수 있어요. 먼저 스스로 답해 본 뒤 확인하세요.</div>'+interviewHtml(D.peai.interview);}}
    ]
  });
}
function viewLEX(){
  academyView({
    id:'lex', bg:'#FBE3E2',
    icon:'<path d="M12 2l3 6 6 .9-4.5 4.4 1 6.3L12 17l-5.5 2.6 1-6.3L3 8.9 9 8l3-6z"/>',
    title:'렉스김 (LexKim) 대비', kr:'Grammar · Writing · Reading · Interview',
    intro:'렉스김은 빅3 중 가장 엄격해요. 특히 문법과 대문자·마침표 같은 기본 규칙을 꼼꼼히 봅니다.',
    tabs:[
      {label:'문법', render:function(){registerQuiz('lex_gram',D.lex.grammar);return '<div class="note">대문자·마침표·시제를 정확히! 알맞은 답을 고르는 연습이에요.</div>'+mcqBlock(D.lex.grammar,'lex_gram');}},
      {label:'글쓰기', render:function(){return '<div class="note">PLAN → WRITE → CHECK. 쓰고 나면 대문자와 마침표를 꼭 확인해요.</div>'+writingHtml(D.lex.writing);}},
      {label:'독해', render:function(){return passageHtml(D.lex.reading[0],'lex_read0');}},
      {label:'인터뷰', render:function(){return '<div class="note">또박또박 완전한 문장으로 답하는 연습을 해요.</div>'+interviewHtml(D.lex.interview);}}
    ]
  });
}

function viewMock(){
  renderNav('mock');
  if(tabState.mock===undefined) tabState.mock=0;
  var ti = tabState.mock;
  var tabs = [
    {label:'A · ILE형', render:renderMockILE},
    {label:'B · 피아이형', render:renderMockPEAI},
    {label:'C · 렉스김형', render:renderMockLEX}
  ];
  app.innerHTML =
    secHead('#E7E0FF','<path d="M9 11l3 3 8-8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>','실전 모의고사','Mock Level Tests · 학원별 형식')
    + '<div class="note enter">실제 시험처럼 차분히 풀어 보세요. 학원별로 보는 영역만 모았습니다.</div>'
    + '<div class="tabs">'+tabs.map(function(t,i){return '<button class="tab'+(i===ti?' on':'')+'" data-tab="mock" data-ti="'+i+'">'+t.label+'</button>';}).join('')+'</div>'
    + '<div id="tabBody"></div>';
  document.getElementById('tabBody').innerHTML = tabs[ti].render();
}
function renderMockILE(){
  var m=D.mock.ile, h='';
  h+='<div class="subtitle">Listening</div>'+listeningHtml(m.listening,'mock_ile_listen');
  h+='<div class="subtitle">Reading</div>'+passageHtml(m.reading[0],'mock_ile_read');
  h+='<div class="subtitle">Grammar</div>';registerQuiz('mock_ile_gram',m.grammar);h+=mcqBlock(m.grammar,'mock_ile_gram');

}
function renderMockPEAI(){
  var m=D.mock.peai, h='';

  h+='<div class="subtitle">Writing</div>'+writingHtml(m.writing);

}
function renderMockLEX(){
  var m=D.mock.lex, h='';
  h+='<div class="subtitle">Grammar</div>';registerQuiz('mock_lex_gram',m.grammar);h+=mcqBlock(m.grammar,'mock_lex_gram');
  h+='<div class="subtitle">Reading</div>'+passageHtml(m.reading[0],'mock_lex_read');
  h+='<div class="subtitle">Writing</div>'+writingHtml(m.writing);
  return h;

function go(view){
  window.scrollTo({top:0,behavior:'auto'});
  if(view==='home'){ renderNav('home'); viewHome(); }
  else if(view==='vocab'){ viewVocab(); }
  else if(view==='ile'){ viewILE(); }
  else if(view==='peai'){ viewPEAI(); }
  else if(view==='lex'){ viewLEX(); }
  else if(view==='mock'){ viewMock(); }
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-pick],[data-action],[data-unit],[data-tab]');
  if(!t) return;
  if(t.hasAttribute('data-go')){ go(t.getAttribute('data-go')); return; }
  if(t.hasAttribute('data-pick')){ handlePick(t); return; }
  if(t.hasAttribute('data-unit')){ vState.unit=+t.getAttribute('data-unit'); vState.idx=0; vState.flip=false; viewVocab(); return; }
  if(t.hasAttribute('data-tab')){
    var sec=t.getAttribute('data-tab'); tabState[sec]=+t.getAttribute('data-ti');
    if(sec==='mock'){ viewMock(); }
    else { ({ile:viewILE,peai:viewPEAI,lex:viewLEX}[sec])(); }
    return;
  }
  var act=t.getAttribute('data-action');
  if(act==='home'){ go('home'); }
  else if(act==='say'){ e.stopPropagation(); speak(t.getAttribute('data-say')); }
  else if(act==='flip'){ vState.flip=!vState.flip; document.getElementById('flash').classList.toggle('flip'); }
  else if(act==='flipbtn'){ vState.flip=!vState.flip; document.getElementById('flash').classList.toggle('flip'); }
  else if(act==='prev'){ if(vState.idx>0){vState.idx--;vState.flip=false;renderVocabBody();} }
  else if(act==='next'){ var u=D.vocabUnits[vState.unit]; if(vState.idx<u.words.length-1){vState.idx++;vState.flip=false;renderVocabBody();} }
  else if(act==='sample'){ var s=document.getElementById('sample_'+t.getAttribute('data-i')); if(s) s.classList.toggle('show'); }
});

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }

if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }

go('home');
})();
</script>
